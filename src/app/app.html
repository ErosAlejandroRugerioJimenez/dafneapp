<div class="bg-slate-900 h-[100dvh] w-full flex items-center justify-center overflow-hidden relative font-sans text-white">
    
    <!-- Botón Escurridizo -->
    <button 
        #catchMeBtn
        (mouseenter)="moveButton()"
        (touchstart)="handleTouch($event)"
        (click)="handleClick()"
        [ngClass]="attempts >= maxAttempts ? 'bg-emerald-500 hover:bg-emerald-600' : 'bg-pink-500 hover:bg-pink-600'"
class="absolute px-6 py-3 text-white font-bold rounded-full shadow-lg transition-transform duration-200 z-10 text-base sm:text-xl max-w-[85vw] text-center leading-tight"        [style.left.px]="buttonLeft"
        [style.top.px]="buttonTop">
        {{ attempts >= maxAttempts ? 'Bueno, ya presióname' : 'Hola Dafne, NO presiones este botón' }}
    </button>

    <!-- Modal Oculto -->
    <div *ngIf="showModal" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-70 z-50 px-4">
        <div class="bg-white text-slate-800 p-8 rounded-2xl shadow-2xl max-w-sm text-center animate-fade-in">
            <h2 class="text-3xl font-black text-pink-500 mb-4">¡Te atrapé!</h2>
            <p class="text-lg mb-6">Te dije que no lo hicieras,pero ya que eres tan terca, me debes unos tacos.</p>
            <button (click)="closeModal()" class="px-6 py-2 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-full transition-colors w-full">
                Acepto mi destino
            </button>
        </div>
    </div>
</div>
